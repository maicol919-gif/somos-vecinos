<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Somos Vecinos</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Admin — Somos Vecinos">
<meta property="og:description" content="Panel de administración de Somos Vecinos.">
<meta property="og:image" content="https://maicol919-gif.github.io/somos-vecinos/og-image.png">
<link rel="stylesheet" href="../css/style.css?v=3">
</head>
<body>
<header class="top">
  <a href="../index.html" class="brand">
    <span class="logo-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12.5c1.5-2 4-2 4 .5 0 2-2.5 3.7-4 4.7-1.5-1-4-2.7-4-4.7 0-2.5 2.5-2.5 4-.5z"/><path d="M4 16c0 2.2 1.8 4 4 4M20 16c0 2.2-1.8 4-4 4"/></svg>
    </span>
    <div class="brand-text">
      <span class="brand-nombre">Somos Vecinos</span>
      <span class="brand-tagline">Admin</span>
    </div>
  </a>
  <nav>
    <a href="../index.html">Ver sitio público</a>
  </nav>
</header>

<main>
  <div id="login-box" class="login-box">
    <h2>Acceso administrador</h2>
    <label>
      Código de acceso
      <input type="password" id="codigo-acceso" placeholder="Código">
    </label>
    <button class="btn-enviar" id="btn-entrar">Entrar</button>
    <div id="login-error" class="mensaje error hidden"></div>
  </div>

  <div id="panel" class="hidden">
    <h2>Casos pendientes</h2>
    <div id="lista-pendientes" class="tabla-casos"></div>

    <h2>Otros casos</h2>
    <div id="lista-otros" class="tabla-casos"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
