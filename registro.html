<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar caso — Somos Vecinos</title>
<meta name="description" content="Registra un caso de alguien afectado por el terremoto para que la comunidad pueda ayudar.">
<meta property="og:title" content="Registrar caso — Somos Vecinos">
<meta property="og:description" content="Registra un caso de alguien afectado por el terremoto para que la comunidad pueda ayudar.">
<meta property="og:image" content="https://maicol919-gif.github.io/somos-vecinos/og-image.png">
<meta property="og:url" content="https://maicol919-gif.github.io/somos-vecinos/registro.html">
<meta property="og:type" content="website">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<header class="top">
  <a href="index.html" class="brand">
    <span class="logo-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12.5c1.5-2 4-2 4 .5 0 2-2.5 3.7-4 4.7-1.5-1-4-2.7-4-4.7 0-2.5 2.5-2.5 4-.5z"/><path d="M4 16c0 2.2 1.8 4 4 4M20 16c0 2.2-1.8 4-4 4"/></svg>
    </span>
    <div class="brand-text">
      <span class="brand-nombre">Somos Vecinos</span>
      <span class="brand-tagline">Ayuda vecino a vecino</span>
    </div>
  </a>

</header>

<main>
  <h2>Registrar un caso</h2>
  <p>Cuéntanos quién necesita ayuda tras el terremoto. Tu caso será revisado antes de publicarse.</p>

  <form id="form-registro" class="card-form">
    <div id="mensaje" class="mensaje hidden"></div>

    <label>
      Nombre de la persona o familia
      <input type="text" id="nombre" name="nombre" required maxlength="120" placeholder="Ej: Familia Gómez">
    </label>

    <label>
      Ciudad
      <input type="text" id="ciudad" name="ciudad" required maxlength="80" placeholder="Ej: Armenia">
    </label>

    <label>
      Descripción corta
      <textarea id="descripcion" name="descripcion" required maxlength="300" placeholder="Describe brevemente la situación"></textarea>
      <span class="contador"><span id="contador-desc">0</span>/300</span>
    </label>

    <div class="items-form">
      <div class="items-form-header">
        <span>¿Qué necesitan? (opcional, se puede editar después)</span>
        <button type="button" class="btn-agregar-item" id="btn-agregar-item">+ Agregar ítem</button>
      </div>
      <div id="items-lista"></div>
    </div>

    <label>
      Categoría general (para que te encuentren en los filtros)
      <select id="tipo_necesidad" name="tipo_necesidad" required>
        <option value="">Selecciona una opción</option>
        <option value="vivienda">Vivienda</option>
        <option value="alimentos">Alimentos</option>
        <option value="dinero">Dinero</option>
        <option value="medicina">Medicina</option>
        <option value="otro">Otro</option>
      </select>
    </label>

    <label>
      Urgencia
      <select id="urgencia" name="urgencia" required>
        <option value="baja">Baja</option>
        <option value="media" selected>Media</option>
        <option value="alta">Alta</option>
        <option value="urgente">Urgente</option>
      </select>
    </label>

    <label>
      Foto (opcional)
      <input type="file" id="foto" name="foto" accept="image/*">
    </label>

    <label>
      Contacto (teléfono o email)
      <input type="text" id="contacto" name="contacto" required maxlength="120" placeholder="Ej: 3001234567 o correo@ejemplo.com">
    </label>

    <button type="submit" class="btn-enviar" id="btn-enviar">Enviar caso</button>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/registro.js"></script>
</body>
</html>
